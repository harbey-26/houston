# Watch for new Houston upstream releases
#
# Runs daily at 9:00 AM UTC (4:00 AM Colombia). When a new release is
# detected, creates a GitHub Issue with merge instructions.
# Can also be triggered manually from the Actions tab.

name: Upstream Release Watch

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check for new upstream release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          UPSTREAM="gethouston/houston"
          LOCAL_REPO="${{ github.repository }}"

          # Get latest upstream release tag
          UPSTREAM_TAG=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.tag_name' 2>/dev/null || echo "")
          if [ -z "$UPSTREAM_TAG" ]; then
            echo "Could not fetch upstream release. Skipping."
            exit 0
          fi
          UPSTREAM_VERSION="${UPSTREAM_TAG#v}"
          echo "Upstream latest: $UPSTREAM_TAG"

          # Check if we already created an issue for this version
          EXISTING=$(gh issue list --repo "$LOCAL_REPO" \
            --search "Upstream Houston $UPSTREAM_TAG" \
            --state all --limit 1 --json number --jq '.[0].number // empty')

          if [ -n "$EXISTING" ]; then
            echo "Issue #$EXISTING already exists for $UPSTREAM_TAG. Skipping."
            exit 0
          fi

          # Get our latest release tag for comparison
          LOCAL_TAG=$(gh api "repos/$LOCAL_REPO/releases/latest" --jq '.tag_name' 2>/dev/null || echo "none")
          echo "Our latest: $LOCAL_TAG"

          # Get upstream release notes
          RELEASE_NOTES=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.body // "No release notes available."')
          RELEASE_URL=$(gh api "repos/$UPSTREAM/releases/latest" --jq '.html_url')

          # Create issue
          gh issue create --repo "$LOCAL_REPO" \
            --title "Upstream Houston $UPSTREAM_TAG available — merge into NodoFlux Agente" \
            --label "upstream" \
            --body "$(cat <<EOF
          ## Houston $UPSTREAM_TAG has been released

          **Release:** $RELEASE_URL
          **NodoFlux current version:** $LOCAL_TAG

          > Heads-up: NodoFlux Agente uses its **own** version line (1.x.y), independent
          > of Houston's (0.4.x). Houston $UPSTREAM_TAG maps to the **next NodoFlux**
          > version you choose below — do NOT tag NodoFlux as $UPSTREAM_TAG.

          ### What to do

          Branch model: \`main\` is the live branded line; releases are cut from \`main\`
          by merging the upstream **release tag** (a tested release), not \`upstream/main\` HEAD.

          \`\`\`bash
          # 1. Work in an isolated worktree so main stays clean
          git fetch upstream --tags
          git worktree add ../NodoFlux_sync -b claude/upstream-sync-$UPSTREAM_TAG main
          cd ../NodoFlux_sync

          # 2. Merge the upstream RELEASE TAG (not upstream/main HEAD)
          git merge $UPSTREAM_TAG
          # Resolve conflicts preserving NodoFlux branding.
          # GOTCHA: diff app/src-tauri/Cargo.toml against the tag so you don't lose
          # the [target.'cfg(target_os="macos")'.dependencies] gate (objc2 must stay
          # macOS-only or the Windows MSI build breaks).

          # 3. Bump the NodoFlux version (pick the next 1.x.y) in app/package.json
          #    (app/src-tauri/tauri.conf.json reads its version from package.json)

          # 4. Verify before tagging
          cargo test --workspace
          (cd ui && pnpm typecheck)
          (cd app && pnpm tsc --noEmit && pnpm check-locales)

          # 5. PR the merge into main, then merge it
          git push -u origin claude/upstream-sync-$UPSTREAM_TAG
          gh pr create --base main --title "sync: Houston $UPSTREAM_TAG" --body "..."
          gh pr merge --squash --delete-branch

          # 6. Tag the NEW NodoFlux version on main → CI builds + publishes
          git checkout main && git pull
          git tag vX.Y.Z          # the NodoFlux version from step 3
          git push origin vX.Y.Z
          # nodoflux-release.yml compiles macOS + Windows and publishes the release
          \`\`\`

          ### Upstream release notes

          $RELEASE_NOTES
          EOF
          )"

          echo "Issue created for upstream $UPSTREAM_TAG"
